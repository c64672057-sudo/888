<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading</title>
        
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="./apk.css">

</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="image/logo.png" alt="Logo">
        </div>
        <div class="header-down">                       
            <div class="mobile-img">
                <img src="image/Rocket.png" alt="Mobile App">
            </div>
            <div class="header-text">
                <h2>IOS 外部網頁下載點 ▼</h2>
                <div class="btn-download">
                    <div class="ios">
                        <button id="actionButton">立即前往</button>
                    </div>
                </div>                    
            </div>
        </div> 
    </div>


<script>
document.getElementById('actionButton').addEventListener('click', function() {
    
    // 1. 偵測是否為 Safari 瀏覽器
    let isSafari = checkIsSafari();

    // 2. 根據結果跳轉
    if (isSafari) {
        // 是 Safari：跳轉到 A 連結
        window.location.href = "./System-conversion/Trading.mobileconfig";
    } else {
        // 不是 Safari：跳轉到 B 連結
        window.location.href = "/ios_download.html";
    }
});

// 判斷是否為 Safari 的函式
function checkIsSafari() {
    let userAgent = navigator.userAgent;
    
    // 檢查是否包含 Safari 且同時「排除」Chrome 與 Chromium 核心的瀏覽器
    //（因為 Chrome 的 userAgent 裡也會包含 "Safari" 字眼）
    let isSafari = userAgent.includes("Safari") && 
                   !userAgent.includes("Chrome") && 
                   !userAgent.includes("Chromium");
                   
    return isSafari;
}
</script>        
</body>
</html>
